<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250" role="img" aria-labelledby="title desc">
  <title id="title">Amanuel Isaak</title>
  <desc id="desc">A dark blue banner with orange accents and the words Building useful things for everyday life.</desc>
  <defs>
